<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="465" viewBox="0 0 880 465">
  <defs>
    <!-- 一般箭頭（深灰） -->
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <!-- 綠色箭頭（K 矩陣路徑） -->
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <!-- 紫色箭頭（驗證路徑） -->
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="880" height="465" fill="#f8fafc" rx="12"/>

  <!-- 標題 -->
  <text x="440" y="32" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    相機內外參估算 Pipeline
  </text>

  <!-- ====================================================================
       ROW 1 — 內參估算
       ==================================================================== -->
  <text x="18" y="62"
        font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">內參估算</text>

  <!-- 輸入：相機影像 -->
  <rect x="20" y="68" width="112" height="48" rx="7"
        fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="76" y="88" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e40af">相機影像</text>
  <text x="76" y="104" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#3b82f6">image/*.jpg</text>

  <!-- 處理：estimate_intrinsics.py -->
  <rect x="185" y="55" width="225" height="95" rx="7"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="297" y="73" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#92400e">
    estimate_intrinsics.py
  </text>
  <line x1="185" y1="83" x2="410" y2="83" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="297" y="98" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#78350f">
    ① Canny + Hough → 消失點
  </text>
  <text x="297" y="113" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#78350f">
    &#160;&#160;&#160;→ 初始 f, cx, cy 估算
  </text>
  <text x="297" y="128" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#78350f">
    ② Cluster 對應點反推修正
  </text>
  <text x="297" y="143" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#b45309">
    &#160;&#160;&#160;(f: 374 → 1005,&#160;cx: 777 → 718)
  </text>

  <!-- 輸出：K.npy -->
  <rect x="463" y="65" width="175" height="75" rx="7"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="550" y="84" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#14532d">
    seq_4_camera_K.npy
  </text>
  <line x1="463" y1="94" x2="638" y2="94" stroke="#16a34a" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="550" y="110" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#166534">
    f = 1005,&#160;&#160;cx = 718,&#160;&#160;cy = 416
  </text>
  <text x="550" y="127" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#166534">
    K ∈ ℝ³ˣ³&#160;&#160;(pixel ↔ ray)
  </text>

  <!-- 箭頭 row 1 -->
  <line x1="132" y1="92" x2="183" y2="92" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="102" x2="461" y2="102" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ====================================================================
       ROW 2 — 外參估算
       ==================================================================== -->
  <text x="18" y="183"
        font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">外參估算</text>

  <!-- 輸入：相機影像 -->
  <rect x="20" y="192" width="112" height="42" rx="7"
        fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="76" y="211" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e40af">相機影像</text>
  <text x="76" y="226" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#3b82f6">image/*.jpg</text>

  <!-- 輸入：雷達點雲 -->
  <rect x="20" y="248" width="112" height="42" rx="7"
        fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="76" y="267" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e40af">雷達點雲</text>
  <text x="76" y="282" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#3b82f6">radar/*.npz</text>

  <!-- 處理大框：annotate_extrinsics_sam2.py -->
  <rect x="185" y="180" width="430" height="130" rx="7"
        fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="199" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#92400e">
    annotate_extrinsics_sam2.py
  </text>
  <line x1="185" y1="209" x2="615" y2="209" stroke="#d97706" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- 子框 ① SAM2 標注 -->
  <rect x="193" y="215" width="120" height="87" rx="5"
        fill="#fde68a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="253" y="229" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#78350f">① SAM2 標注</text>
  <line x1="193" y1="237" x2="313" y2="237" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="2,2"/>
  <text x="253" y="251" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">FrameAnnotator</text>
  <text x="253" y="264" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">點擊車輛</text>
  <text x="253" y="277" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">→ mask centroid</text>
  <text x="253" y="290" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">(SAM2 Hiera-T)</text>

  <!-- 子框箭頭 ①→② -->
  <line x1="313" y1="258" x2="321" y2="258" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 子框 ② 手動 C↔M 配對 -->
  <rect x="321" y="215" width="123" height="87" rx="5"
        fill="#fde68a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="382" y="229" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#78350f">② 手動 C↔M</text>
  <line x1="321" y1="237" x2="444" y2="237" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="2,2"/>
  <text x="382" y="251" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">ManualMatcher</text>
  <text x="382" y="264" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">雷達圖點選三角</text>
  <text x="382" y="277" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">→ 影像 mask</text>
  <text x="382" y="290" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">跳過不確定 C</text>

  <!-- 子框箭頭 ②→③ -->
  <line x1="444" y1="258" x2="452" y2="258" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 子框 ③ PnP 求解 -->
  <rect x="452" y="215" width="155" height="87" rx="5"
        fill="#fde68a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="529" y="229" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#78350f">③ PnP 求解</text>
  <line x1="452" y1="237" x2="607" y2="237" stroke="#f59e0b" stroke-width="0.6" stroke-dasharray="2,2"/>
  <text x="529" y="251" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">cv2.solvePnPRansac</text>
  <text x="529" y="264" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">3D↔2D 對應點</text>
  <text x="529" y="277" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">reprojErr = 20 px</text>
  <text x="529" y="290" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#92400e">inlier 篩選</text>

  <!-- 輸出：extrinsics.npz -->
  <rect x="668" y="195" width="190" height="85" rx="7"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="763" y="217" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#14532d">
    seq_4_extrinsics.npz
  </text>
  <line x1="668" y1="227" x2="858" y2="227" stroke="#16a34a" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="763" y="245" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#166534">
    R ∈ ℝ³ˣ³,&#160;&#160;t ∈ ℝ³,&#160;&#160;K ∈ ℝ³ˣ³
  </text>
  <text x="763" y="262" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#166534">
    P_cam = R · P_radar + t
  </text>

  <!-- 箭頭 row 2 -->
  <line x1="132" y1="213" x2="183" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="132" y1="269" x2="183" y2="257" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="615" y1="245" x2="666" y2="245" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- K.npy → ③PnP（綠色虛線） -->
  <polyline points="550,140 550,162 530,162 530,213"
            fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"
            marker-end="url(#arr-g)"/>
  <text x="558" y="158"
        font-family="system-ui,sans-serif" font-size="9" fill="#16a34a">K 矩陣</text>

  <!-- ====================================================================
       ROW 3 — 批量驗證
       ==================================================================== -->
  <text x="18" y="350"
        font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">批量驗證</text>

  <!-- 處理：viz_extrinsics.py -->
  <rect x="185" y="360" width="220" height="82" rx="7"
        fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="295" y="379" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#4c1d95">
    viz_extrinsics.py
  </text>
  <line x1="185" y1="389" x2="405" y2="389" stroke="#7c3aed" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="295" y="405" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#5b21b6">全序列 cluster 投影疊圖</text>
  <text x="295" y="421" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#5b21b6">camera + radar 雙欄 → mp4</text>
  <text x="295" y="434" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed" font-style="italic">
    （含影像 + 雷達點雲 + K, R, t）
  </text>

  <!-- 輸出：驗證影片 -->
  <rect x="425" y="370" width="165" height="58" rx="7"
        fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="507" y="392" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#14532d">驗證影片</text>
  <line x1="425" y1="402" x2="590" y2="402" stroke="#16a34a" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="507" y="418" text-anchor="middle"
        font-family="system-ui,sans-serif" font-size="10" fill="#166534">
    extrinsics_check.mp4
  </text>

  <!-- 箭頭 row 3 -->
  <line x1="405" y1="399" x2="423" y2="399" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- extrinsics.npz → viz_extrinsics（紫色虛線） -->
  <polyline points="763,280 763,342 295,342 295,358"
            fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5,3"
            marker-end="url(#arr-p)"/>
  <text x="780" y="313"
        font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed">K, R, t</text>

</svg>
